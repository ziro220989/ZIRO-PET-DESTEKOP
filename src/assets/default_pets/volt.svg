<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="volt-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="bird-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192a20" />
      <stop offset="100%" stop-color="#08140e" />
    </linearGradient>
  </defs>

  <style>
    @keyframes birdGlide {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-9px) rotate(1deg); }
    }
    @keyframes wingSweep {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(0.85); }
    }
    .bird-group { animation: birdGlide 3.2s ease-in-out infinite; }
    .bird-wings { animation: wingSweep 1.8s ease-in-out infinite; transform-origin: 100px 105px; }
  </style>

  <g class="bird-group">
    <!-- Aerodynamic Jet Wings -->
    <g class="bird-wings">
      <!-- Left Jet Wing -->
      <polygon points="80,105 20,80 35,115 75,120" fill="url(#bird-body)" stroke="#00ff66" stroke-width="2" />
      <line x1="25" y1="88" x2="65" y2="108" stroke="#00ffcc" stroke-width="2" filter="url(#volt-glow)" />

      <!-- Right Jet Wing -->
      <polygon points="120,105 180,80 165,115 125,120" fill="url(#bird-body)" stroke="#00ff66" stroke-width="2" />
      <line x1="175" y1="88" x2="135" y2="108" stroke="#00ffcc" stroke-width="2" filter="url(#volt-glow)" />
    </g>

    <!-- Tail Thrusters -->
    <polygon points="90,145 110,145 105,170 95,170" fill="#08140e" stroke="#00ff66" stroke-width="1.5" />
    <polygon points="95,170 105,170 100,182" fill="#00ff66" filter="url(#volt-glow)" />

    <!-- Sleek Body -->
    <polygon points="100,55 125,95 115,148 85,148 75,95" fill="url(#bird-body)" stroke="#00ff66" stroke-width="2.5" />

    <!-- Cyber Crest / Feathers -->
    <polygon points="100,32 108,55 92,55" fill="#00ff66" filter="url(#volt-glow)" />
    <polygon points="112,40 114,56 104,56" fill="#00ffcc" opacity="0.7" />

    <!-- Head & Visor -->
    <polygon points="100,60 120,80 100,95 80,80" fill="#0d1b14" stroke="#00ff66" stroke-width="2" />
    <!-- Glowing Visor Eye line -->
    <line x1="86" y1="78" x2="114" y2="78" stroke="#00ff66" stroke-width="3.5" stroke-linecap="round" filter="url(#volt-glow)" />
    <circle cx="100" cy="78" r="2.5" fill="#ffffff" />

    <!-- Cyber Beak -->
    <polygon points="95,85 105,85 100,98" fill="#00ff66" filter="url(#volt-glow)" />

    <!-- Turbine Core in Chest -->
    <circle cx="100" cy="115" r="7" fill="#05140b" stroke="#00ff66" stroke-width="1.8" />
    <circle cx="100" cy="115" r="3.5" fill="#00ffcc" filter="url(#volt-glow)" />
  </g>
</svg>
