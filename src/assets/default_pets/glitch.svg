<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="slime-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="slime-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0d3a24" />
      <stop offset="100%" stop-color="#05170e" />
    </linearGradient>
  </defs>

  <style>
    @keyframes slimeJiggle {
      0%, 100% { transform: scale(1, 1) translateY(0); }
      30% { transform: scale(1.08, 0.92) translateY(2px); }
      60% { transform: scale(0.94, 1.06) translateY(-8px); }
    }
    @keyframes particleFloat {
      0%, 100% { transform: translateY(0px) scale(0.8); opacity: 0.3; }
      50% { transform: translateY(-12px) scale(1.2); opacity: 0.9; }
    }
    @keyframes blinkSlime {
      0%, 92%, 100% { transform: scaleY(1); }
      96% { transform: scaleY(0.1); }
    }
    .slime-body { animation: slimeJiggle 2.6s ease-in-out infinite; transform-origin: center bottom; }
    .p1 { animation: particleFloat 2s ease-in-out infinite; }
    .p2 { animation: particleFloat 2.8s ease-in-out infinite 0.5s; }
    .slime-eye { animation: blinkSlime 3.8s infinite; transform-origin: center; }
  </style>

  <g class="slime-body">
    <!-- Floating Cyber Particles -->
    <circle class="p1" cx="45" cy="80" r="3" fill="#00ff66" filter="url(#slime-glow)" />
    <circle class="p2" cx="155" cy="70" r="4" fill="#00ffff" filter="url(#slime-glow)" />
    <polygon class="p1" points="160,110 164,115 158,118" fill="#00ff66" opacity="0.6" />

    <!-- Slime Outer Glow / Cyber Aura -->
    <path d="M 50 145 C 35 120 40 85 100 80 C 160 85 165 120 150 145 C 135 165 65 165 50 145 Z" fill="url(#slime-grad)" stroke="#00ff66" stroke-width="2.5" filter="url(#slime-glow)" />

    <!-- Slime Head Antenna / Sensor -->
    <path d="M 100 80 Q 95 60 115 50" stroke="#00ff66" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <circle cx="115" cy="50" r="4.5" fill="#00ffcc" filter="url(#slime-glow)" />

    <!-- Eyes (Cyber Slime Kawaii Blinking Eyes) -->
    <g class="slime-eye">
      <!-- Left Eye -->
      <circle cx="82" cy="118" r="8" fill="#00180a" stroke="#00ff66" stroke-width="2" />
      <circle cx="82" cy="118" r="5" fill="#00ff66" filter="url(#slime-glow)" />
      <circle cx="80" cy="116" r="2" fill="#ffffff" />
      <!-- Right Eye -->
      <circle cx="118" cy="118" r="8" fill="#00180a" stroke="#00ff66" stroke-width="2" />
      <circle cx="118" cy="118" r="5" fill="#00ff66" filter="url(#slime-glow)" />
      <circle cx="116" cy="116" r="2" fill="#ffffff" />
    </g>

    <!-- Mouth -->
    <path d="M 96 130 Q 100 135 104 130" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Internal data particles / core -->
    <circle cx="100" cy="100" r="6" fill="#00ff66" opacity="0.7" filter="url(#slime-glow)" />
  </g>
</svg>
