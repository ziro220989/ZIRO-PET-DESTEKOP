<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Neon green fluor glow filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182a22" />
      <stop offset="100%" stop-color="#0b1310" />
    </linearGradient>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff66" />
      <stop offset="100%" stop-color="#00ffcc" />
    </linearGradient>
  </defs>

  <style>
    @keyframes floatCat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes tailWag {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes visorPulse {
      0%, 100% { opacity: 0.95; filter: drop-shadow(0 0 6px #00ff66); }
      50% { opacity: 0.75; filter: drop-shadow(0 0 12px #00ff88); }
    }
    @keyframes earTwitch {
      0%, 90%, 100% { transform: rotate(0deg); }
      95% { transform: rotate(-5deg); }
    }
    .cat-group { animation: floatCat 3.5s ease-in-out infinite; transform-origin: center bottom; }
    .cat-tail { animation: tailWag 2s ease-in-out infinite; transform-origin: 140px 145px; }
    .cat-visor { animation: visorPulse 2s ease-in-out infinite; }
    .cat-ear-l { animation: earTwitch 4s ease-in-out infinite; transform-origin: 65px 70px; }
  </style>

  <g class="cat-group">
    <!-- Tail with glowing tip -->
    <path class="cat-tail" d="M 140 145 C 165 140, 175 110, 160 90 C 152 78, 142 85, 148 95 C 158 110, 145 130, 130 145 Z" fill="#14211b" stroke="#00ff66" stroke-width="2.5" filter="url(#neon-glow)" />

    <!-- Feet/Paws -->
    <ellipse cx="75" cy="162" rx="16" ry="10" fill="#182b23" stroke="#00ff66" stroke-width="1.5" />
    <ellipse cx="125" cy="162" rx="16" ry="10" fill="#182b23" stroke="#00ff66" stroke-width="1.5" />

    <!-- Body -->
    <path d="M 65 110 C 50 140, 60 162, 100 162 C 140 162, 150 140, 135 110 C 125 90, 75 90, 65 110 Z" fill="url(#cyber-grad)" stroke="#1f3b2f" stroke-width="2" />
    
    <!-- Cybernetic chest armor plates -->
    <polygon points="90,122 110,122 105,142 95,142" fill="#0d1813" stroke="#00ff66" stroke-width="1.5" />
    <circle cx="100" cy="132" r="3.5" fill="#00ff66" filter="url(#neon-glow)" />

    <!-- Left Ear with cyber antenna -->
    <polygon class="cat-ear-l" points="60,80 45,35 80,62" fill="url(#cyber-grad)" stroke="#00ff66" stroke-width="2" />
    <line x1="53" y1="48" x2="40" y2="30" stroke="#00ff66" stroke-width="2" filter="url(#neon-glow)" />
    <circle cx="40" cy="30" r="2.5" fill="#00ff66" filter="url(#neon-glow)" />

    <!-- Right Ear -->
    <polygon points="140,80 155,35 120,62" fill="url(#cyber-grad)" stroke="#00ff66" stroke-width="2" />
    <polygon points="135,74 148,46 123,63" fill="#00ff66" opacity="0.3" />

    <!-- Head -->
    <circle cx="100" cy="85" r="44" fill="url(#cyber-grad)" stroke="#224234" stroke-width="2.5" />

    <!-- Glowing Cyber Visor (Eyes) -->
    <path class="cat-visor" d="M 66 82 Q 100 75 134 82 Q 138 96 128 98 Q 100 93 72 98 Q 62 94 66 82 Z" fill="#00180a" stroke="url(#neon-grad)" stroke-width="2.5" />
    
    <!-- Visor Eye HUD elements -->
    <circle cx="82" cy="88" r="5" fill="#00ff66" filter="url(#neon-glow)" />
    <circle cx="118" cy="88" r="5" fill="#00ff66" filter="url(#neon-glow)" />
    <path d="M 75 88 L 89 88" stroke="#00ffcc" stroke-width="1.5" />
    <path d="M 111 88 L 125 88" stroke="#00ffcc" stroke-width="1.5" />

    <!-- Cyber Whiskers -->
    <line x1="58" y1="94" x2="35" y2="92" stroke="#00ff66" stroke-width="1.5" opacity="0.8" />
    <line x1="58" y1="99" x2="32" y2="104" stroke="#00ff66" stroke-width="1.5" opacity="0.8" />
    <line x1="142" y1="94" x2="165" y2="92" stroke="#00ff66" stroke-width="1.5" opacity="0.8" />
    <line x1="142" y1="99" x2="168" y2="104" stroke="#00ff66" stroke-width="1.5" opacity="0.8" />

    <!-- Cute Robotic Mouth / Speaker -->
    <path d="M 94 104 Q 100 108 106 104" stroke="#00ff66" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>
</svg>
